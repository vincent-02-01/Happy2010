<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#08030c" />
  <meta name="description" content="Món quà đặc biệt nhân ngày Phụ nữ Việt Nam 20/10" />
  <title>20.10 | Gửi đến em ♥</title>
  <style>
    :root { --pink: #ff5caa; --pink-light: #ffe4f2; --bg: #08030c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body { color: white; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
    #rain, #particles { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #rain { z-index: 0; }
    #particles { z-index: 2; pointer-events: none; }
    .shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 54% 65% at center, rgba(7,2,12,.62), rgba(9,0,14,.17) 66%, rgba(6,0,9,.15)),
        linear-gradient(to top, rgba(2,0,4,.45), transparent 24%, transparent 77%, rgba(2,0,4,.22)); }
    .grain { position: fixed; z-index: 3; inset: 0; pointer-events: none; opacity: .06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.36'/%3E%3C/svg%3E"); }
    .top-label { position: fixed; z-index: 4; left: 50%; top: calc(16px + env(safe-area-inset-top));
      transform: translateX(-50%); white-space: nowrap; color: #ffb6d8aa; letter-spacing: .22em;
      text-transform: uppercase; font-size: 10px; font-weight: 600; pointer-events: none; }
    .intro { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 28px;
      background: radial-gradient(ellipse at center, rgba(38,8,35,.82), rgba(7,1,10,.88));
      transition: opacity .85s, visibility .85s; }
    .intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-box { text-align: center; width: min(430px, 100%); }
    .mini-heart { width: 56px; height: 56px; margin: 0 auto 18px; display: grid; place-items: center;
      color: #ff78b6; font-size: 38px; filter: drop-shadow(0 0 18px #ff3d9688); animation: heartbeat 2.1s ease-in-out infinite; }
    .eyebrow { margin: 0 0 13px; color: #ffadcfff; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 7vw, 55px); line-height: 1.17; font-weight: 750;
      letter-spacing: -.04em; color: #fff3fa; text-shadow: 0 0 26px #fa398b66; }
    .intro-desc { font-size: 14px; line-height: 1.8; margin: 19px auto 26px; max-width: 330px; color: #ecc6d8; }
    button { font: inherit; cursor: pointer; }
    .begin { background: linear-gradient(125deg, #ffb4d4, #ff5aa3); color: #31081f;
      border: 1px solid #ffe1ef80; font-size: 15px; font-weight: 750; letter-spacing: .01em;
      padding: 15px 30px; border-radius: 999px; box-shadow: 0 6px 38px #ff2b8255;
      transition: transform .2s, box-shadow .2s; }
    .begin:active { transform: scale(.96); }
    .rotate-hint { color: #d29db6; font-size: 12px; margin-top: 23px; }
    .controls { position: fixed; z-index: 5; bottom: calc(12px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right)); display: flex; gap: 9px; opacity: 0;
      transform: translateY(10px); transition: .5s; pointer-events: none; }
    .controls.visible { opacity: 1; transform: none; pointer-events: auto; }
    .control { background: #1c0d21bb; border: 1px solid #ffa3d04f; border-radius: 30px;
      color: #f9c6de; min-height: 38px; padding: 7px 14px; font-size: 12px; backdrop-filter: blur(5px); }
    .control:active { background: #70294988; }
    .final-caption { position: fixed; z-index: 4; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%;
      transform: translate(-50%, 12px); text-align: center; width: 90vw; pointer-events: none;
      font-size: 12px; letter-spacing: .2em; color: #ffc2dd; opacity: 0; transition: 1.6s; }
    .final-caption.visible { opacity: .95; transform: translate(-50%, 0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes heartbeat { 0%,100% {transform: scale(1)} 12% {transform: scale(1.12)} 28% {transform: scale(1)} 43% {transform: scale(1.07)} }
    @media (orientation: landscape) and (max-height: 500px) {
      .intro-box { width: min(640px,100%); }
      .mini-heart { height: 42px; margin-bottom: 6px; font-size: 32px; }
      .eyebrow { margin-bottom: 8px; }
      h1 { font-size: clamp(30px, 6vh, 44px); }
      .intro-desc { margin: 8px auto 15px; }
      .rotate-hint { display: none; }
      .top-label { top: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { .mini-heart { animation: none; } }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="shade"></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="grain"></div>
  <div class="top-label">20.10 ♥ dành riêng cho người đẹp</div>

  <section class="intro" id="intro">
    <div class="intro-box">
      <div class="mini-heart">♥</div>
      <p class="eyebrow">20 tháng 10</p>
      <h1>Gửi đến người đẹp<br/>một điều đặc biệt</h1>
      <p class="intro-desc">Có những lời muốn nói, nhưng bb muốn để những vì sao màu hồng kể lại...</p>
      <button class="begin" id="startBtn">Mở món quà ♡</button>
      <p class="rotate-hint">Xoay ngang điện thoại để xem hiệu ứng đẹp hơn.</p>
    </div>
  </section>

  <div class="final-caption" id="caption">20.10.2026 · Luôn mỉm cười nhé ♡</div>
  <div class="controls" id="controls">
    <button class="control" id="soundBtn" title="Bật hoặc tắt nhạc">♫ Tắt nhạc</button>
    <button class="control" id="replayBtn" title="Xem lại từ đầu">↻ Xem lại</button>
  </div>
  <div class="sr-only" id="announce" aria-live="polite"></div>
  <audio id="music" src="nhac-nen.mp3" loop preload="auto"></audio>

<script>
"use strict";
// ============================================================
// CHỈNH NỘI DUNG Ở ĐÂY: mỗi dòng sẽ xuất hiện một lần.
// Dùng \n để xuống dòng. duration tính bằng mili-giây.
// ============================================================
const SETTINGS = {
  messages: [
    { text: "Hôm nay 20.10", duration: 3500 },
    { text: "Là ngày\ncủa em", duration: 3500 },
    { text: "Chúc em luôn\nhạnh phúc", duration: 4200 },
    { text: "Những điều tốt\nđẹp nhất", duration: 4000 },
    { text: "Sẽ đến\nvới em", duration: 3500 },
    { text: "Luôn có\nngười", duration: 3500 },
    { text: "Thương em\nthật lòng", duration: 3900 },
    { text: "Mà người\nđó", duration: 3500 },
    { text: "Là anh\nđược không?", duration: 4100 },
    { text: "Em đồng ý\nnhé?", duration: 3700 },
    { text: "Làm người yêu\nanh nhé ♡", duration: 4400 }
  ],
  finalText: "Anh yêu em", // Dòng chữ giữa trái tim
  finalCaption: "20.10.2026 · Luôn mỉm cười nhé ♡",
  rainColor: [255, 54, 132], // RGB của mưa chữ
  maxTextParticles: 2700,
  heartParticles: 1250
};
// ============================================================
const rainCanvas = document.getElementById('rain');
const fxCanvas = document.getElementById('particles');
const rain = rainCanvas.getContext('2d');
const fx = fxCanvas.getContext('2d');
const intro = document.getElementById('intro');
const controls = document.getElementById('controls');
const caption = document.getElementById('caption');
const announce = document.getElementById('announce');
const music = document.getElementById('music');
const startBtn = document.getElementById('startBtn');
const replayBtn = document.getElementById('replayBtn');
const soundBtn = document.getElementById('soundBtn');

let W = 0, H = 0, dpr = 1, columnGap = 18, columns = [];
let playing = false, finished = false, sceneIndex = -1;
let sceneStartedAt = 0, pausedMs = 0, prevFrame = 0, particles = [];
let textImage = null, heartScale = 1, startTime = 0;
let audioOn = true, lastRainStep = 0;
const alphabet = '01·:;*+♡♥LOVExYzアイウエオ';
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  for (const c of [rainCanvas, fxCanvas]) {
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
  }
  rain.setTransform(dpr,0,0,dpr,0,0);
  fx.setTransform(dpr,0,0,dpr,0,0);
  columnGap = H < 500 ? 16 : 19;
  columns = Array.from({length: Math.ceil(W / columnGap) + 1}, (_,i) => ({
    x: i * columnGap, y: rand(-H, H), speed: rand(.35,1.45), length: Math.floor(rand(6,24))
  }));
  rain.fillStyle = '#08030c'; rain.fillRect(0,0,W,H);
  heartScale = Math.min(W / 41, H / 36);
  if (sceneIndex >= 0) setScene(sceneIndex, performance.now(), true);
}
window.addEventListener('resize', resize, {passive:true});

function drawRain(t) {
  // Frame-rate-independent fade, but limit code-rain redraw to ~30 FPS.
  if (t - lastRainStep < 29) return;
  const dt = lastRainStep ? Math.min(2, (t-lastRainStep)/33) : 1;
  lastRainStep = t;
  rain.fillStyle = 'rgba(7, 2, 11, .135)';
  rain.fillRect(0,0,W,H);
  rain.font = (H < 500 ? 12 : 13) + 'px monospace';
  rain.textAlign = 'center'; rain.textBaseline = 'middle';
  for (const c of columns) {
    c.y += c.speed * columnGap * .42 * dt;
    if (c.y > H + c.length*columnGap) { c.y = rand(-300,-20); c.speed = rand(.5,1.6); }
    if (Math.random() < .22) continue;
    const letter = alphabet[Math.floor(Math.random()*alphabet.length)];
    const intensity = Math.random();
    const a = .30 + intensity*.50;
    rain.fillStyle = `rgba(${SETTINGS.rainColor.join(',')},${a})`;
    rain.fillText(letter, c.x, c.y);
    if (Math.random()<.12) {
      rain.fillStyle = 'rgba(255,191,222,.85)';
      rain.fillText(letter,c.x,c.y);
    }
  }
}

function wrapText(text) {
  return text.split('\n');
}

function sampleText(text) {
  const buf = document.createElement('canvas');
  buf.width = Math.max(1,Math.ceil(W)); buf.height = Math.max(1,Math.ceil(H));
  const c = buf.getContext('2d', {willReadFrequently:true});
  const lines = wrapText(text);
  let fs = Math.min(H * (H < 500 ? .155 : .09), W * .105, 88);
  fs = Math.max(25,fs);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (;;) {
    c.font = `800 ${fs}px system-ui, "Segoe UI", sans-serif`;
    if (Math.max(...lines.map(s => c.measureText(s).width)) <= W*.84 || fs<=22) break;
    fs -= 1;
  }
  c.fillStyle = '#ffd9ea';
  c.shadowColor = '#ff61b0'; c.shadowBlur = 5;
  const lineHeight = fs * 1.27;
  const top = H / 2 - (lines.length - 1) * lineHeight/2;
  lines.forEach((line,i) => c.fillText(line, W/2, top+i*lineHeight));
  c.shadowBlur = 0;
  const pixels = c.getImageData(0,0,buf.width,buf.height).data;
  const step = W*H>850000 ? 5 : (W*H>320000? 4:3);
  const targets=[];
  for (let y=2;y<H;y+=step) for(let x=2;x<W;x+=step) {
    const alpha = pixels[(Math.floor(y)*buf.width+Math.floor(x))*4+3];
    if(alpha>105 && Math.random()>.08) targets.push({x,y});
  }
  // Sampling with a cap protects less powerful mobile devices.
  for(let i=targets.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [targets[i],targets[j]]=[targets[j],targets[i]]; }
  targets.length = Math.min(SETTINGS.maxTextParticles, targets.length);
  return {buf, targets};
}

function heartXY(t) {
  const s=Math.sin(t);
  return { x: 16*s*s*s,
    y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) };
}
function heartTargets() {
  const targets=[];
  for(let i=0;i<SETTINGS.heartParticles;i++) {
    let theta = 2*Math.PI*(i+.35*Math.random())/SETTINGS.heartParticles;
    const p=heartXY(theta);
    targets.push({ x: W/2+p.x*heartScale+rand(-2,2),
                   y: H/2+p.y*heartScale*.97+rand(-2,2) });
  }
  return targets.sort(()=>Math.random()-.5);
}

function setScene(index, t, preserve=false) {
  sceneIndex = index;
  sceneStartedAt = t;
  const isHeart = index >= SETTINGS.messages.length;
  let positions;
  if (isHeart) {
    positions = heartTargets();
    textImage = null;
    caption.textContent = SETTINGS.finalCaption;
    announce.textContent = SETTINGS.finalText;
  } else {
    const message = SETTINGS.messages[index].text;
    const sampled=sampleText(message);
    positions=sampled.targets;
    textImage=sampled.buf;
    announce.textContent=message.replaceAll('\n',' ');
    caption.classList.remove('visible');
  }
  if (!preserve) {
    const old = particles;
    particles=positions.map((target,i) => {
      let src = old.length ? old[Math.floor(Math.random()*old.length)] : null;
      let x = src ? src.x : rand(0,W);
      let y = src ? src.y : rand(0,H);
      if (index===0) { x=rand(0,W); y=rand(0,H); }
      return {
        x,y, vx:rand(-1,1),vy:rand(-1,1),
        tx:target.x, ty:target.y,
        size:rand(.8,1.9), phase:rand(0,7),
        spread:rand(.6,2.2)
      };
    });
  } else {
    particles=positions.map((target,i)=>({
      x:target.x,y:target.y,tx:target.x,ty:target.y,
      vx:0,vy:0,size:rand(.8,1.9),phase:rand(0,7),spread:1
    }));
  }
}

function drawScene(t) {
  fx.clearRect(0,0,W,H);
  if(!playing) return;
  const heart = sceneIndex >= SETTINGS.messages.length;
  const elapsed = Math.max(0,t-sceneStartedAt);
  const duration=heart ? Infinity : SETTINGS.messages[sceneIndex].duration;
  let envelope = heart ? clamp(elapsed/1700,0,1) :
    Math.min(clamp(elapsed/1050,0,1), clamp((duration-elapsed)/800,0,1));
  const ease = heart ? .031 : .045;
  const drift = heart ? 1.7 : .65;

  if (heart) {
    // Thin, luminous outline underneath the individual particles.
    const pulse=1+Math.sin(t/560)*.018;
    fx.save();
    fx.beginPath();
    for(let i=0;i<=360;i++) {
      const p=heartXY(i/360*Math.PI*2);
      const x=W/2+p.x*heartScale*pulse;
      const y=H/2+p.y*heartScale*.97*pulse;
      if(i===0) fx.moveTo(x,y); else fx.lineTo(x,y);
    }
    fx.closePath();
    fx.strokeStyle=`rgba(255,63,152,${.34*envelope})`;
    fx.shadowColor='#ff4dab'; fx.shadowBlur=20;
    fx.lineWidth=2.7; fx.stroke(); fx.restore();
  } else if (textImage) {
    fx.save(); fx.globalAlpha = .22*envelope;
    fx.shadowColor = '#ff95cb'; fx.shadowBlur = 14;
    fx.drawImage(textImage,0,0,W,H);
    fx.restore();
  }

  fx.save(); fx.shadowColor='#ff74b5'; fx.shadowBlur=4;
  for (const p of particles) {
    let wiggle=Math.sin(t/390+p.phase)*drift;
    const tx=p.tx+wiggle, ty=p.ty+Math.cos(t/530+p.phase)*drift;
    // Spring interpolation makes scattered points gather into each new phrase.
    p.vx=(p.vx+(tx-p.x)*ease)*.69;
    p.vy=(p.vy+(ty-p.y)*ease)*.69;
    p.x+=p.vx; p.y+=p.vy;
    const twinkle= .55+ .45*Math.sin(t/460 + p.phase)**2;
    fx.fillStyle=`rgba(255,${heart?105:196},${heart?183:226},${envelope*(.44+.56*twinkle)})`;
    const size=p.size*(heart?1.3:1.0);
    fx.fillRect(p.x-size/2,p.y-size/2,size,size);
  }
  fx.restore();

  if(heart) {
    const alpha=clamp((elapsed-1000)/1600,0,1);
    if(alpha>0){
      const fs=clamp(Math.min(W*.047,H*.070),17,38);
      fx.save(); fx.textAlign='center'; fx.textBaseline='middle';
      fx.font=`700 ${fs}px system-ui, "Segoe UI", sans-serif`;
      fx.fillStyle=`rgba(255,225,239,${alpha})`;
      fx.shadowColor='#ff5fb1'; fx.shadowBlur=23;
      fx.fillText(SETTINGS.finalText,W/2,H/2+H*.015);
      fx.restore();
    }
    if(elapsed > 2500) {
      caption.classList.add('visible');
      controls.classList.add('visible');
      finished=true;
    }
  }
}

function loop(t) {
  drawRain(t);
  if (playing) {
    if (sceneIndex>=0 && sceneIndex<SETTINGS.messages.length &&
        t-sceneStartedAt >= SETTINGS.messages[sceneIndex].duration) {
      setScene(sceneIndex+1,t);
    }
    drawScene(t);
  }
  prevFrame=t;
  requestAnimationFrame(loop);
}

function start() {
  playing=true; finished=false;
  controls.classList.remove('visible');
  caption.classList.remove('visible');
  intro.classList.add('hide');
  startTime=performance.now();
  setScene(0,startTime);
  if(audioOn) music.play().catch(()=>{}); // iOS yêu cầu thao tác nhấn nút trước khi phát nhạc.
  // Trên thiết bị hỗ trợ, mở fullscreen khi người dùng bắt đầu.
  if(document.documentElement.requestFullscreen && window.matchMedia('(orientation: landscape)').matches) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}
startBtn.addEventListener('click',start);
replayBtn.addEventListener('click',()=>{
  music.currentTime=0;
  start();
});
soundBtn.addEventListener('click',()=>{
  audioOn=!audioOn;
  soundBtn.textContent=audioOn?'♫ Tắt nhạc':'♫ Bật nhạc';
  if(audioOn && playing) music.play().catch(()=>{});
  else music.pause();
});

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
