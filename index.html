<script>
"use strict";
// Keep the layout viewport stable while the software keyboard covers the page.
const viewportShell = document.getElementById('viewportShell');
let keyboardFocused = false;
function fitFixedPanels() {
  for (const selector of ['.code-box', '.intro-box']) {
    const panel = document.querySelector(selector);
    if (!panel || !panel.offsetHeight) continue;
    const host = panel.parentElement;
    const padding = parseFloat(getComputedStyle(host).paddingTop) + parseFloat(getComputedStyle(host).paddingBottom);
    const scale = Math.min(1, (host.clientHeight - padding) / panel.offsetHeight);
    panel.style.transform = `scale(${Math.max(.1, scale)})`;
  }
}
function syncFixedViewport() {
  if (keyboardFocused) return;
  const width = window.innerWidth;
  const height = window.innerHeight;
  viewportShell.style.setProperty('--view-width', width + 'px');
  viewportShell.style.setProperty('--view-height', height + 'px');
  viewportShell.classList.toggle('phone-portrait',
    window.matchMedia('(pointer: coarse)').matches && width < height);
  fitFixedPanels();
}
function pinKeyboardViewport() {
  const offset = keyboardFocused ? (window.visualViewport?.offsetTop || 0) : 0;
  viewportShell.style.setProperty('--keyboard-offset', offset + 'px');
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
}
window.addEventListener('resize', syncFixedViewport, {passive:true});
window.addEventListener('scroll', pinKeyboardViewport, {passive:true});
window.visualViewport?.addEventListener('scroll', pinKeyboardViewport, {passive:true});
window.visualViewport?.addEventListener('resize', pinKeyboardViewport, {passive:true});
document.addEventListener('touchmove', event => event.preventDefault(), {passive:false});
new ResizeObserver(fitFixedPanels).observe(viewportShell);
document.fonts?.ready.then(fitFixedPanels);
syncFixedViewport();
// Chặn bôi chọn trên giao diện, vẫn giữ thao tác gõ và xóa trong ô mã.
document.addEventListener('selectstart', event => event.preventDefault());
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'a') event.preventDefault();
});
const ACCESS_CODE = '29031983';
const GATE_EMOJIS = [
  "Emoji/Ảnh ChatGPT 14_58_51 20 thg 10, 2026-1.png",
  "Emoji/Ảnh ChatGPT 14_58_53 20 thg 10, 2026-2.png",
  "Emoji/Ảnh ChatGPT 14_58_54 20 thg 10, 2026-3.png",
  "Emoji/Ảnh ChatGPT 14_58_55 20 thg 10, 2026-4.png"
];
const codeEmoji = document.getElementById('codeEmoji');
let gateAttempt = 0;
const codeForm = document.getElementById('codeForm');
const codeInput = document.getElementById('accessCode');
codeInput.addEventListener('focus', () => {
  keyboardFocused = true;
  pinKeyboardViewport();
});
codeInput.addEventListener('blur', () => {
  keyboardFocused = false;
  pinKeyboardViewport();
  // The closing keyboard animates; wait for a subsequent viewport resize to re-fit.
});
const codeError = document.getElementById('codeError');
let unlocked = false;
codeForm.addEventListener('submit', event => {
  event.preventDefault();
  if (unlocked) return;
  if (codeInput.value !== ACCESS_CODE) {
    gateAttempt = Math.min(gateAttempt + 1, GATE_EMOJIS.length - 1);
    codeEmoji.src = GATE_EMOJIS[gateAttempt];
    codeError.textContent = 'Mã chưa đúng rồi, người đặc biệt thử lại nhé ♡';
    codeInput.setAttribute('aria-invalid', 'true');
    codeInput.focus();
    codeInput.value = '';
    return;
  }
  unlocked = true;
  codeInput.value = '';
  document.getElementById('codeGate').hidden = true;
  document.getElementById('experience').hidden = false;
  codeInput.blur();
  fitFixedPanels();
  initGift();
  document.getElementById('startBtn').focus();
});
codeInput.addEventListener('input', () => {
  codeError.textContent = '';
  codeInput.removeAttribute('aria-invalid');
});

    text: "Bởi đôi khi, sự đồng hành đẹp nhất\nkhông nằm ở những điều lớn lao,\nmà ở việc luôn dành cho nhau sự quan tâm chân thành.",
    duration: 11500
  },

  {
    text: "BB trân trọng những gì chúng ta đang có,\ntrân trọng sự tin tưởng, những câu chuyện,\nvà cả những khoảnh khắc giản dị giữa hai người.",
    duration: 11500
  },

  {
    text: "Hy vọng chúng ta sẽ luôn như thế nhé.\nVẫn chân thành, vẫn thoải mái,\nvẫn có thể sẻ chia với nhau thật nhiều điều trong cuộc sống.",
    duration: 12000
  },

  {
    text: "Cảm ơn người đẹp vì đã xuất hiện.\nCảm ơn vì đã cho BB cơ hội được lắng nghe,\nđược sẻ chia và trở thành một người đặc biệt. ♡",
    duration: 12500
  },

  {
    type: "final",
    text: "20/10 thật dịu dàng nhé,\nngười đẹp của BB ♡",
    caption:
      "20.10.2026 · Mong người đẹp luôn bình an, " +
      "hạnh phúc và được yêu thương thật lòng.\n" +
      "Mong chúng ta sẽ luôn có thật nhiều điều để kể, " +
      "thật nhiều niềm vui để sẻ chia, " +
      "và thật nhiều khoảnh khắc đẹp để cùng trân trọng.\n" +
      "Cảm ơn vì một đã là một người thật đặc biệt. — BB",
    replay: "↻ Đọc lại lời nhắn"
  }
];

const introStep = STEPS[0];
const finalStep = STEPS[STEPS.length - 1];
const SETTINGS = {
  messages: STEPS.slice(1, -1),
  finalText: finalStep.text,
  finalCaption: finalStep.caption,
  rainColor: [255, 54, 132], // RGB của mưa chữ
  maxTextParticles: 9000,
  fireflies: { gatherMs: 1900, scatterMs: 1700, pauseMs: 850, radius: 1, glow: 5 },
  heartParticles: 1250
};
// ============================================================
const rainCanvas = document.getElementById('rain');
const fxCanvas = document.getElementById('particles');
const rain = rainCanvas.getContext('2d');
const fx = fxCanvas.getContext('2d');
const intro = document.getElementById('intro');
const controls = document.getElementById('controls');
const caption = document.getElementById('caption');
const announce = document.getElementById('announce');
const music = document.getElementById('music');
music.src = music.dataset.src;
const startBtn = document.getElementById('startBtn');
const replayBtn = document.getElementById('replayBtn');
const experience = document.getElementById('experience');
document.querySelector('.top-label').textContent = introStep.label;
document.querySelector('.eyebrow').textContent = introStep.eyebrow;
const title = document.querySelector('h1');
title.textContent = introStep.title;
title.style.whiteSpace = 'pre-line';
document.querySelector('.intro-desc').textContent = introStep.description;
document.querySelector('.rotate-hint').textContent = introStep.hint;
startBtn.textContent = introStep.button;
replayBtn.textContent = finalStep.replay;
caption.textContent = finalStep.caption;

let W = 0, H = 0, dpr = 1, columnGap = 18, columns = [];
let playing = false, finished = false, sceneIndex = -1;
let sceneStartedAt = 0, pausedMs = 0, prevFrame = 0, particles = [];
let heartScale = 1, startTime = 0;
let lastRainStep = 0;
const alphabet = '01·:;*+♡♥LOVExYzアイウエオ';
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function resize() {
  W = experience.clientWidth; H = experience.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  for (const c of [rainCanvas, fxCanvas]) {
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
  }
  rain.setTransform(dpr,0,0,dpr,0,0);
  fx.setTransform(dpr,0,0,dpr,0,0);
  columnGap = H < 500 ? 16 : 19;
  columns = Array.from({length: Math.ceil(W / columnGap) + 1}, (_,i) => ({
    x: i * columnGap, y: rand(-H, H), speed: rand(.35,1.45), length: Math.floor(rand(6,24))
  }));
  rain.fillStyle = '#08030c'; rain.fillRect(0,0,W,H);
  heartScale = Math.min(W / 41, H / 36);
  if (sceneIndex >= 0) setScene(sceneIndex, performance.now(), true);
}
window.addEventListener('resize', resize, {passive:true});

function drawRain(t) {
  // Frame-rate-independent fade, but limit code-rain redraw to ~30 FPS.
  if (t - lastRainStep < 29) return;
  const dt = lastRainStep ? Math.min(2, (t-lastRainStep)/33) : 1;
  lastRainStep = t;
  rain.fillStyle = 'rgba(7, 2, 11, .135)';
  rain.fillRect(0,0,W,H);
  rain.font = (H < 500 ? 12 : 13) + 'px monospace';
  rain.textAlign = 'center'; rain.textBaseline = 'middle';
  for (const c of columns) {
    c.y += c.speed * columnGap * .42 * dt;
    if (c.y > H + c.length*columnGap) { c.y = rand(-300,-20); c.speed = rand(.5,1.6); }
    if (Math.random() < .22) continue;
    const letter = alphabet[Math.floor(Math.random()*alphabet.length)];
    const intensity = Math.random();
    const a = .30 + intensity*.50;
    rain.fillStyle = `rgba(${SETTINGS.rainColor.join(',')},${a})`;
    rain.fillText(letter, c.x, c.y);
    if (Math.random()<.12) {
      rain.fillStyle = 'rgba(255,191,222,.85)';
      rain.fillText(letter,c.x,c.y);
    }
  }
}

function wrapText(text) {
  return text.split('\n');
}

function sampleText(text) {
  const buf = document.createElement('canvas');
  buf.width = Math.max(1,Math.ceil(W)); buf.height = Math.max(1,Math.ceil(H));
  const c = buf.getContext('2d', {willReadFrequently:true});
  const lines = wrapText(text);
  let fs = Math.min(H * (H < 500 ? .155 : .09), W * .105, 88);
  fs = Math.max(25,fs);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (;;) {
    c.font = `800 ${fs}px system-ui, "Segoe UI", sans-serif`;
    if (Math.max(...lines.map(s => c.measureText(s).width)) <= W*.84 || fs<=22) break;
    fs -= 1;
  }
  c.fillStyle = '#fff4fa';
  c.shadowBlur = 0;
  const lineHeight = fs * 1.27;
  const top = H / 2 - (lines.length - 1) * lineHeight/2;
  lines.forEach((line,i) => c.fillText(line, W/2, top+i*lineHeight));
  c.shadowBlur = 0;
  const pixels = c.getImageData(0,0,buf.width,buf.height).data;
  // Small glyphs need tighter sampling so accents and thin strokes survive.
  const step = clamp(fs / 24, 1.35, 2);
  const budget = Math.min(SETTINGS.maxTextParticles, W * H < 500000 ? 6500 : 9000);
  const targets=[];
  for (let y=2;y<H;y+=step) for(let x=2;x<W;x+=step) {
    const alpha = pixels[(Math.floor(y)*buf.width+Math.floor(x))*4+3];
    if(alpha>100) targets.push({x,y});
  }
  // Evenly retain points across every line rather than randomly thinning the text.
  const count = Math.min(budget, targets.length);
  const evenlySpaced = Array.from({length: count}, (_, i) =>
    targets[Math.floor((i + .5) * targets.length / count)]);
  return {targets: evenlySpaced};
}

function heartXY(t) {
  const s=Math.sin(t);
  return { x: 16*s*s*s,
    y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) };
}
function heartTargets() {
  const targets=[];
  for(let i=0;i<SETTINGS.heartParticles;i++) {
    let theta = 2*Math.PI*(i+.35*Math.random())/SETTINGS.heartParticles;
    const p=heartXY(theta);
    targets.push({ x: W/2+p.x*heartScale+rand(-2,2),
                   y: H/2+p.y*heartScale*.97+rand(-2,2) });
  }
  return targets.sort(()=>Math.random()-.5);
}

function setScene(index, t, preserve=false) {
  sceneIndex = index;
  if (!preserve) sceneStartedAt = t;
  const isHeart = index >= SETTINGS.messages.length;
  let positions;
  if (isHeart) {
    positions = heartTargets();
    caption.textContent = SETTINGS.finalCaption;
    announce.textContent = SETTINGS.finalText;
  } else {
    const message = SETTINGS.messages[index].text;
    const sampled=sampleText(message);
    positions=sampled.targets;
    announce.textContent=message.replaceAll('\n',' ');
    caption.classList.remove('visible');
  }
  particles = positions.map((target, i) => {
    // Each phrase starts from a fresh cloud after the previous one fully disappears.
    const x = preserve ? target.x : rand(0, W);
    const y = preserve ? target.y : rand(0, H);
    const angle = rand(0, Math.PI * 2);
    const distance = rand(Math.min(W, H) * .25, Math.min(W, H) * .85);
    return {
      x, y, sx: x, sy: y, tx: target.x, ty: target.y,
      dx: Math.cos(angle) * distance, dy: Math.sin(angle) * distance,
      size: rand(.58, .95) * SETTINGS.fireflies.radius,
      sparkle: Math.random() < .075,
      phase: rand(0, Math.PI * 2), speed: rand(.0016, .004),
      delay: rand(0, .18), bend: rand(-60, 60)
    };
  });
}

const smooth = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
// A cached halo avoids expensive shadowBlur work for thousands of tiny lights.
const fireflySprite = document.createElement('canvas');
fireflySprite.width = fireflySprite.height = 32;
const glowContext = fireflySprite.getContext('2d');
const glowGradient = glowContext.createRadialGradient(16,16,0,16,16,16);
glowGradient.addColorStop(0, 'rgba(255,245,252,1)');
glowGradient.addColorStop(.12, 'rgba(255,218,239,.95)');
glowGradient.addColorStop(.32, 'rgba(255,130,195,.35)');
glowGradient.addColorStop(1, 'rgba(255,80,170,0)');
glowContext.fillStyle = glowGradient;
glowContext.fillRect(0,0,32,32);

function drawScene(t) {
  fx.clearRect(0,0,W,H);
  if(!playing) return;
  const heart = sceneIndex >= SETTINGS.messages.length;
  const elapsed = Math.max(0,t-sceneStartedAt);
  const duration=heart ? Infinity : SETTINGS.messages[sceneIndex].duration;
  const pauseMs = heart ? 0 : Math.min(SETTINGS.fireflies.pauseMs, duration * .12);
  const visibleDuration = duration - pauseMs;
  const gatherMs = Math.min(SETTINGS.fireflies.gatherMs, visibleDuration * .34);
  const scatterMs = Math.min(SETTINGS.fireflies.scatterMs, visibleDuration * .30);
  const gather = heart ? smooth(elapsed / 1700) : clamp(elapsed / gatherMs, 0, 1);
  const scatter = heart ? 0 : clamp((elapsed - visibleDuration + scatterMs) / scatterMs, 0, 1);
  const envelope = heart ? clamp(elapsed/1700,0,1) :
    smooth(elapsed / 550) * (1 - smooth((scatter - .2) / .8));

  if (heart) {
    // Thin, luminous outline underneath the individual particles.
    const pulse=1+Math.sin(t/560)*.018;
    fx.save();
    fx.beginPath();
    for(let i=0;i<=360;i++) {
      const p=heartXY(i/360*Math.PI*2);
      const x=W/2+p.x*heartScale*pulse;
      const y=H/2+p.y*heartScale*.97*pulse;
      if(i===0) fx.moveTo(x,y); else fx.lineTo(x,y);
    }
    fx.closePath();
    fx.strokeStyle=`rgba(255,63,152,${.34*envelope})`;
    fx.shadowColor='#ff4dab'; fx.shadowBlur=20;
    fx.lineWidth=2.7; fx.stroke(); fx.restore();
  }

  fx.save();
  fx.globalCompositeOperation = 'lighter';
  if (envelope > 0) for (const p of particles) {
    const arrival = smooth((gather - p.delay) / (1 - p.delay));
    const departure = smooth((scatter - p.delay * .6) / (1 - p.delay * .6));
    const flutter = Math.sin(arrival * Math.PI) * p.bend;
    const drift = heart ? 1.2 : .32 + departure * 7;
    p.x = p.sx + (p.tx - p.sx) * arrival + p.dx * departure
      + Math.sin(p.phase + arrival * Math.PI * 2) * flutter
      + Math.sin(t * .0015 + p.phase) * drift;
    p.y = p.sy + (p.ty - p.sy) * arrival + p.dy * departure
      + Math.cos(p.phase + arrival * Math.PI * 2) * flutter
      + Math.cos(t * .0012 + p.phase) * drift;
    // Independent slow pulses and brief bright flashes, with a crisp pin-point core.
    const pulse = (.5 + .5 * Math.sin(t * p.speed + p.phase)) ** 3;
    const flash = (.5 + .5 * Math.sin(t * p.speed * 2.3 + p.phase)) ** 18;
    const brightness = .62 + .28 * pulse + .55 * flash;
    const halo = SETTINGS.fireflies.glow * p.size * (1 + flash * .65);
    fx.globalAlpha = Math.min(1, (.16 + .32 * pulse + .85 * flash)) * envelope;
    fx.drawImage(fireflySprite, p.x - halo, p.y - halo, halo * 2, halo * 2);
    fx.globalAlpha = Math.min(1, brightness) * envelope;
    fx.fillStyle = '#fff1fa';
    fx.beginPath();
    fx.arc(p.x, p.y, p.size * (.95 + flash * .45), 0, Math.PI * 2);
    fx.fill();
    if (p.sparkle && flash > .55) {
      // Brief, sparse glints stand out above the steady, readable pin-point cores.
      const ray = 1.5 + flash * 2;
      fx.globalAlpha = (flash - .55) / .45 * envelope;
      fx.lineWidth = .65;
      fx.strokeStyle = '#fff9fd';
      fx.beginPath();
      fx.moveTo(p.x - ray, p.y); fx.lineTo(p.x + ray, p.y);
      fx.moveTo(p.x, p.y - ray); fx.lineTo(p.x, p.y + ray);
      fx.stroke();
    }
  }
  fx.restore();

  if(heart) {
    const alpha=clamp((elapsed-1000)/1600,0,1);
    if(alpha>0){
      let fs=clamp(Math.min(W*.047,H*.070),14,38);
      const lines = wrapText(SETTINGS.finalText);
      fx.save(); fx.textAlign='center'; fx.textBaseline='middle';
      const maxWidth = heartScale * 24;
      do {
        fx.font=`700 ${fs}px system-ui, "Segoe UI", sans-serif`;
        if (Math.max(...lines.map(line => fx.measureText(line).width)) <= maxWidth) break;
        fs -= 1;
      } while (fs > 10);
      fx.fillStyle=`rgba(255,225,239,${alpha})`;
      fx.shadowColor='#ff5fb1'; fx.shadowBlur=6;
      lines.forEach((line, i) => fx.fillText(line, W/2,
        H/2 + H*.015 + (i - (lines.length-1)/2) * fs * 1.4));
      fx.restore();
    }
    if(elapsed > 2500) {
      caption.classList.add('visible');
      controls.classList.add('visible');
      finished=true;
    }
  }
}

function loop(t) {
  drawRain(t);
  if (playing) {
    if (sceneIndex>=0 && sceneIndex<SETTINGS.messages.length &&
        t-sceneStartedAt >= SETTINGS.messages[sceneIndex].duration) {
      setScene(sceneIndex+1,t);
    }
    drawScene(t);
  }
  prevFrame=t;
  requestAnimationFrame(loop);
}

function start() {
  playing=true; finished=false;
  controls.classList.remove('visible');
  caption.classList.remove('visible');
  intro.classList.add('hide');
  startTime=performance.now();
  setScene(0,startTime);
  enablePresentation();
}

function playMusic() {
  music.play().catch(() => {});
}
async function enablePresentation() {
  playMusic();
  const root = document.documentElement;
  try {
    if (!document.fullscreenElement) {
      if (root.requestFullscreen) await root.requestFullscreen();
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
    }
  } catch (_) { /* Thử lại sau thao tác chạm nếu trình duyệt chặn. */ }
  try {
    if (window.matchMedia('(pointer: coarse)').matches && screen.orientation?.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch (_) { /* Bố cục CSS vẫn hiển thị ngang khi không hỗ trợ khóa xoay. */ }
}
startBtn.addEventListener('click',start);
replayBtn.addEventListener('click',()=>{
  music.currentTime=0;
  start();
});
// Tự phát nếu được phép; lần chạm đầu tiên mở khóa nhạc và fullscreen.
document.addEventListener('pointerdown', enablePresentation, {once:true});
document.addEventListener('keydown', enablePresentation, {once:true});
enablePresentation();

resize();
requestAnimationFrame(loop);
}
</script>
</body>
</html>
